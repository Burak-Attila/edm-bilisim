; PlatformIO ile derlemek/yüklemek için:  pio run -t upload
; (Arduino IDE kullanıyorsan firmware/eriste_kesme/eriste_kesme.ino dosyasını aç.)
[platformio]
src_dir = firmware/eriste_kesme

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    waspinator/AccelStepper
    marcoschwartz/LiquidCrystal_I2C
